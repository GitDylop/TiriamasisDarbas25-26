<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kintamieji</title>
    <link rel="stylesheet" href="mainStyle.css">
</head>
<body>
    <header>
        <div class="spacer"></div>
        <div id="settings-icon" class="icon"></div>
        <div id="profile-icon" class="icon"></div>
        <div id="ai-icon" class="icon"></div>
    </header>
    <div id="task-header">
        <div id="task-name">Masyvai</div>
        <button id="run-btn">Vygdyti</button>
        <button id="submit-btn">Pateikti</button>
    </div>
    <div id="user-area">
        <div id="task">
            
        </div>
        <div id="code" contenteditable="true">

        </div>
    </div>
</body>
<script>
const codeDiv = document.getElementById('code');

codeDiv.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
        e.preventDefault();
        const selection = window.getSelection();
        const range = selection.getRangeAt(0);

        const tabNode = document.createTextNode('    ');
        range.insertNode(tabNode);

        range.setStartAfter(tabNode);
        range.setEndAfter(tabNode);
        selection.removeAllRanges();
        selection.addRange(range);
    }
});

window.onload = async () => {
    await loadTask();
}
</script>
<script src="script.js"></script>
</html>
