<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Užduotis</title>
    <link rel="stylesheet" href="../mainStyle.css">
</head>
<body>
    <header style="background: linear-gradient(90deg, rgb(0, 183, 255), rgb(255, 0, 255));">
        <a href="../gemini.html">&larr; Atgal</a>
    </header>
    <div id="task-header">
        <div id="task-name"></div>
        <button id="run-btn" onclick="runPython()">Vygdyti</button>
        <button id="submit-btn" onclick="submitPython()">Pateikti</button>
    </div>
    <div id="user-area">
        <div class="area" id="panel1">
                <div class="tabIsland">
                    <div class="tab" active onclick="switchPanelTab(this, 'panel1', 'task')">
                        Užduotis
                    </div>
                    <div class="tab" onclick="switchPanelTab(this, 'panel1', 'answer')">
                        Atsakymas
                    </div>
                </div>
                <div id="task" class="panel" active>

                </div>
                <div id="answer" class="panel">
                    
                </div>
            </div>
        <div class="area" id="panel2">
            <div class="tabIsland">
                <div class="tab" onclick="switchPanelTab(this, 'panel2', 'code')" active>
                    Kodas
                </div>
            </div>
            <div id="code" contenteditable="true" class="panel" active spellcheck="false">

            </div>
        </div>
        <div class="area" id="panel3" style="grid-column: span 2;">
            <div class="tabIsland">
                <div class="tab" onclick="switchPanelTab(this, 'panel3', 'output')" active>
                    Išvestis
                </div>
                <div class="tab" onclick="switchPanelTab(this, 'panel3', 'tests')">
                    Testai
                </div>
            </div>
            <div id="output" class="panel" active>

            </div>
            <div id="tests" class="panel">

            </div>
        </div>
    </div>
</body>
<script>
const codeDiv = document.getElementById('code');

codeDiv.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
        e.preventDefault();
        const selection = window.getSelection();
        const range = selection.getRangeAt(0);

        const tabNode = document.createTextNode('    ');
        range.insertNode(tabNode);

        range.setStartAfter(tabNode);
        range.setEndAfter(tabNode);
        selection.removeAllRanges();
        selection.addRange(range);
    }
});

window.onload = async () => {
    await loadTask();
}
</script>
<script src="../script.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</html>
